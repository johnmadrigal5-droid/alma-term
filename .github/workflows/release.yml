name: Release

# A v* tag packages every platform and leaves a draft GitHub release with the installers.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    uses: ./.github/workflows/package.yml

  release:
    needs: package
    runs-on: ubuntu-24.04
    # The only job that can write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release en borrador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "Alma Term $GITHUB_REF_NAME" dist/*
