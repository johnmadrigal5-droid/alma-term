name: CI

on:
  # Every branch push: the checks of a push appear on its pull request all the same.
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      package:
        description: Empaquetar en Linux, Windows y macOS con prueba de humo (package.yml)
        type: boolean
        default: false

# A new push replaces the previous push run of the same branch; a manual run (with packaging)
# is never cancelled by a push.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - name: Permitir el sandbox de Electron (namespaces sin privilegios)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: pnpm install --frozen-lockfile
      - name: Descargar la imagen del servidor SSH de test
        run: docker pull lscr.io/linuxserver/openssh-server:10.3_p1-r1-ls239
      - run: pnpm exec prettier --check .
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:native
      - name: Llavero real para safeStorage (criterio 3 con cifrado real)
        run: sudo apt-get update && sudo apt-get install -y gnome-keyring libsecret-1-0 libsecret-tools dbus-x11
      - name: E2E
        env:
          ALMA_E2E_EXPECT_KEYRING: '1'
          ALMA_PASSWORD_STORE: gnome-libsecret
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          dbus-run-session -- bash -c '
            echo -n alma | gnome-keyring-daemon --unlock --components=secrets
            if echo -n probe | secret-tool store --label=alma-probe probe 1 && [ "$(secret-tool lookup probe 1)" = probe ]; then
              echo "secret service: OK"
            else
              echo "secret service: FALLO"
            fi
            xvfb-run -a pnpm e2e'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: apps/desktop/test-results

  package:
    if: github.event_name == 'workflow_dispatch' && inputs.package
    permissions:
      contents: read
    uses: ./.github/workflows/package.yml
